openapi: 3.0.3
info:
  title: SandboxManager Control HTTP API
  version: v1
  description: |
    Native HTTP control-plane API for trusted Sandbox providers. This API is
    independent from the E2B-compatible API. JSON field names use snake_case.
    Except for migration, callers must pass the owning profile in
    X-Sandbox-Profile-ID; profile_id and resource IDs owned by the path must
    not be repeated in request bodies.
servers:
  - url: http://sandbox-manager:8081
tags:
  - name: Templates
  - name: Sandboxes
  - name: Snapshots
paths:
  /v1/templates:
    post:
      operationId: CreateTemplate
      tags: [Templates]
      parameters:
        - $ref: '#/components/parameters/ProfileID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '202':
          description: Template build accepted.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Error'}
  /v1/templates/{template_id}:
    parameters:
      - $ref: '#/components/parameters/TemplateID'
      - $ref: '#/components/parameters/ProfileID'
    get:
      operationId: GetTemplate
      tags: [Templates]
      responses:
        '200':
          description: Current Template.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: DeleteTemplate
      tags: [Templates]
      responses:
        '202':
          description: Deletion accepted; returns the deleting Template.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Template'}
        '204':
          description: Template was already absent.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes:
    post:
      operationId: CreateSandbox
      tags: [Sandboxes]
      parameters:
        - $ref: '#/components/parameters/ProfileID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
      responses:
        '201':
          description: Sandbox created or the idempotent result returned.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/ProfileID'
    get:
      operationId: GetSandbox
      tags: [Sandboxes]
      responses:
        '200':
          description: Current Sandbox.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: PatchSandbox
      tags: [Sandboxes]
      description: |
        Replaces the supported mutable Sandbox metadata using one optimistic
        Store update. Phase one supports only sandbox.network_policy. A
        successful response confirms persisted metadata only; BatchAgent and
        Sandlet runtime policy update is not yet implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchSandboxRequest'}
      responses:
        '200':
          description: Updated Sandbox metadata.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        '409':
          description: The Sandbox is busy or the single optimistic update lost a race. The caller may read and retry.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: DeleteSandbox
      tags: [Sandboxes]
      responses:
        '202':
          description: Deletion accepted.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes/{sandbox_id}/renew:
    post:
      operationId: RenewSandbox
      tags: [Sandboxes]
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/ProfileID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenewSandboxRequest'}
      responses:
        '200':
          description: Renewed Sandbox.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes/{sandbox_id}/pause:
    post:
      operationId: PauseSandbox
      tags: [Sandboxes]
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/ProfileID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseSandboxRequest'}
      responses:
        '202':
          description: Pause accepted.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes/{sandbox_id}/resume:
    post:
      operationId: ResumeSandbox
      tags: [Sandboxes]
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/ProfileID'
      responses:
        '200':
          description: Resumed Sandbox.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes/{sandbox_id}/migrations:
    post:
      operationId: MigrateSandbox
      tags: [Sandboxes]
      description: Internal control-plane operation; profile header is not required.
      parameters:
        - $ref: '#/components/parameters/SandboxID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MigrateSandboxRequest'}
      responses:
        '202':
          description: Migration accepted.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MigrateSandboxResponse'}
        default: {$ref: '#/components/responses/Error'}
  /v1/sandboxes/{sandbox_id}/snapshots:
    post:
      operationId: CreateSnapshot
      tags: [Snapshots]
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/ProfileID'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSnapshotRequest'}
      responses:
        '202':
          description: Snapshot accepted.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        default: {$ref: '#/components/responses/Error'}
  /v1/snapshots/{snapshot_id}:
    get:
      operationId: GetSnapshot
      tags: [Snapshots]
      parameters:
        - $ref: '#/components/parameters/SnapshotID'
        - $ref: '#/components/parameters/ProfileID'
      responses:
        '200':
          description: Current Snapshot.
          headers: {X-Trace-Id: {$ref: '#/components/headers/TraceID'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        default: {$ref: '#/components/responses/Error'}
components:
  headers:
    TraceID:
      schema: {type: string, minLength: 32, maxLength: 32}
      description: Server-generated trace ID for correlating access and lifecycle logs.
  parameters:
    ProfileID:
      name: X-Sandbox-Profile-ID
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Owning SandboxManager Profile ID. This is routing authority, not end-user authentication.
    TemplateID:
      name: template_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    SnapshotID:
      name: snapshot_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  responses:
    Error:
      description: Request or operation failed. The HTTP status carries the failure class.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceID'
        Retry-After:
          schema: {type: string}
          description: Present on HTTP 429 responses.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ResourceSpec:
      type: object
      additionalProperties: false
      properties:
        vcpu_count: {type: integer, format: int32}
        memory_mb: {type: integer, format: int32}
        disk_size_mb: {type: integer, format: int32}
    BuildStep:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, description: 'One of RUN, COPY, ENV, WORKDIR, USER.'}
        args:
          type: array
          items: {type: string}
        files_hash: {type: string}
    TemplateBuildSpec:
      type: object
      additionalProperties: false
      required: [from_image, resource_spec]
      properties:
        from_image: {type: string}
        resource_spec: {$ref: '#/components/schemas/ResourceSpec'}
        start_command: {type: string}
        ready_command: {type: string}
        build_steps:
          type: array
          items: {$ref: '#/components/schemas/BuildStep'}
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      required: [build_spec]
      properties:
        build_spec: {$ref: '#/components/schemas/TemplateBuildSpec'}
        metadata: {$ref: '#/components/schemas/StringMap'}
    Template:
      type: object
      additionalProperties: false
      properties:
        template_id: {type: string}
        state: {$ref: '#/components/schemas/TemplateState'}
        resource_spec: {$ref: '#/components/schemas/ResourceSpec'}
        reason: {type: string}
        updated_at: {type: string, format: date-time}
    CreateSandboxRequest:
      type: object
      additionalProperties: false
      required: [request_id, resource_spec]
      properties:
        request_id: {type: string}
        template_id: {type: string}
        snapshot_id: {type: string}
        timeout_seconds: {$ref: '#/components/schemas/Int64'}
        env_vars: {$ref: '#/components/schemas/StringMap'}
        metadata: {$ref: '#/components/schemas/StringMap'}
        resource_spec: {$ref: '#/components/schemas/ResourceSpec'}
        network_policy:
          $ref: '#/components/schemas/SandboxNetworkPolicy'
      oneOf:
        - required: [template_id]
        - required: [snapshot_id]
    RenewSandboxRequest:
      type: object
      additionalProperties: false
      required: [timeout_seconds]
      properties:
        timeout_seconds: {$ref: '#/components/schemas/Int64'}
    PatchSandboxRequest:
      type: object
      additionalProperties: false
      required: [request_id, sandbox]
      properties:
        request_id: {type: string}
        sandbox: {$ref: '#/components/schemas/SandboxPatch'}
    SandboxPatch:
      type: object
      additionalProperties: false
      required: [network_policy]
      properties:
        network_policy: {$ref: '#/components/schemas/SandboxNetworkPolicy'}
    SandboxNetworkPolicy:
      type: object
      additionalProperties: false
      description: Complete replacement egress policy. An empty object means allow all egress.
      properties:
        allowed_cidrs:
          type: array
          items: {type: string}
        denied_cidrs:
          type: array
          items: {type: string}
        allowed_domains:
          type: array
          items: {type: string}
        rules:
          type: object
          additionalProperties: {$ref: '#/components/schemas/SandboxNetworkDomainRules'}
    SandboxNetworkDomainRules:
      type: object
      additionalProperties: false
      properties:
        rules:
          type: array
          items: {$ref: '#/components/schemas/SandboxNetworkRule'}
    SandboxNetworkRule:
      type: object
      additionalProperties: false
      properties:
        transform: {$ref: '#/components/schemas/SandboxNetworkTransform'}
    SandboxNetworkTransform:
      type: object
      additionalProperties: false
      properties:
        headers: {$ref: '#/components/schemas/StringMap'}
    PauseSandboxRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string}
    MigrateSandboxRequest:
      type: object
      additionalProperties: false
      required: [eviction]
      properties:
        eviction: {$ref: '#/components/schemas/Eviction'}
    MigrateSandboxResponse:
      type: object
      additionalProperties: false
      properties:
        sandbox: {$ref: '#/components/schemas/Sandbox'}
        snapshot_id: {type: string}
    CreateSnapshotRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: {type: string}
        metadata: {$ref: '#/components/schemas/StringMap'}
    Sandbox:
      type: object
      additionalProperties: false
      properties:
        sandbox_id: {type: string}
        template_id: {type: string}
        snapshot_id: {type: string}
        state: {$ref: '#/components/schemas/SandboxState'}
        endpoint: {type: string}
        resume_snapshot_id: {type: string}
        expire_time: {type: string, format: date-time}
        message: {type: string}
        updated_at: {type: string, format: date-time}
        resource_spec: {$ref: '#/components/schemas/ResourceSpec'}
        runtime_endpoint: {type: string}
        network_policy: {$ref: '#/components/schemas/SandboxNetworkPolicy'}
    Snapshot:
      type: object
      additionalProperties: false
      properties:
        snapshot_id: {type: string}
        sandbox_id: {type: string}
        state: {$ref: '#/components/schemas/SnapshotState'}
        reason: {type: string}
        updated_at: {type: string, format: date-time}
        resource_spec: {$ref: '#/components/schemas/ResourceSpec'}
    Eviction:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source: {$ref: '#/components/schemas/EvictionSource'}
        reason: {type: string}
    StringMap:
      type: object
      additionalProperties: {type: string}
    Int64:
      oneOf:
        - type: string
          pattern: '^-?[0-9]+$'
        - type: integer
          format: int64
      description: Protobuf JSON int64. JSON numeric input is also accepted for migration compatibility.
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string, description: Stable HTTP failure class.}
        reason: {type: string, description: Stable operation-specific reason.}
        message: {type: string, description: Human-readable diagnostic; must not be parsed.}
    TemplateState:
      type: string
      enum: [TEMPLATE_STATE_UNSPECIFIED, TEMPLATE_PENDING, TEMPLATE_BUILDING, TEMPLATE_READY, TEMPLATE_FAILED, TEMPLATE_DELETING, TEMPLATE_DELETED]
    SandboxState:
      type: string
      enum: [SANDBOX_STATE_UNSPECIFIED, SANDBOX_CREATING, SANDBOX_ALLOCATED, SANDBOX_RUNNING, SANDBOX_PAUSING, SANDBOX_PAUSED, SANDBOX_PAUSE_FAILED, SANDBOX_RESUMING, SANDBOX_RESUME_FAILED, SANDBOX_DELETING, SANDBOX_DELETED, SANDBOX_FAILED, SANDBOX_UNKNOWN, SANDBOX_MIGRATING]
    SnapshotState:
      type: string
      enum: [SNAPSHOT_STATE_UNSPECIFIED, SNAPSHOT_PENDING, SNAPSHOT_RUNNING, SNAPSHOT_COMPLETED, SNAPSHOT_FAILED]
    EvictionSource:
      type: string
      enum: [EVICTION_SOURCE_UNSPECIFIED, EVICTION_SOURCE_NODE_RESOURCE_EXHAUSTED, EVICTION_SOURCE_NODE_MAINTENANCE]
